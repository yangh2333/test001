{% extends "base.html" %}

{% block title %}预警管理{% endblock %}

{% block content %}
<div class="page-title">预警管理</div>

{% if alerts %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
    <p style="color: #888;">共 {{ alerts|length }} 条未处理预警</p>
</div>

<div>
    {% for alert in alerts %}
    <div class="alert-item" id="alert-{{ alert.id }}">
        <div class="alert-header">
            <span class="alert-id">预警 #{{ alert.id }}</span>
            <span class="alert-time">{{ alert.triggered_at }}</span>
        </div>
        <div class="alert-message">{{ alert.message }}</div>
        <button onclick="resolveAlert({{ alert.id }})" class="btn btn-danger" style="margin-top: 12px;">
            ✅ 标记为已处理
        </button>
    </div>
    {% endfor %}
</div>
{% else %}
<div class="empty-state">
    <div class="icon">✅</div>
    <p>当前无未处理预警</p>
    <a href="/" class="btn btn-primary" style="margin-top: 16px;">返回首页</a>
</div>
{% endif %}
{% endblock %}
